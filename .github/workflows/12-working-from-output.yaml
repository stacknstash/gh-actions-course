name: 12-working from-output

on:
 workflow_dispatch:
    inputs:
        build-status:
            description: 'Build status'
            type: choice
            options:
                - success
                - failure
            default: 'success'

jobs:
    build-job:
        runs-on: ubuntu-latest
        outputs: 
            build-output: ${{ steps.build.outputs.status }}
        steps:
            - name: print github output path
              run: echo "GITHUB_OUTPUT path is $GITHUB_OUTPUT"
            - name: build
              id: build
              run: echo "status=${{ github.event.inputs.build-status }}" >> $GITHUB_OUTPUT


    
    deploy-job:
        runs-on: ubuntu-latest
        needs: build-job
        steps:
            - name: deploy
              if: ${{ needs.build-job.outputs.build-output == 'success' }}
              run: echo "Deploying with build status ${{ needs.build-job.outputs.build-output }}"
