name: 13 - using caching

on:
    workflow_dispatch:
        inputs:
            use-cache:
                description: Whether to use caching or not
                type: boolean
                default: true

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: .github/13-caching/react-app
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: check repository files
              run: |
                pwd
                ls -la
            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: '20.x'
            - name: Install dependencies
              run: npm ci
            - name: testing
              run: npm run test
            - name: Building
              run: npm run build
            - name: Deploy to non prod
              run: echo "Deploying to non prod environment"
