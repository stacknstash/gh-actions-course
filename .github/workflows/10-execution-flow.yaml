name: execution-flow

on:
    workflow_dispatch:
        inputs:
            pass-unit-tests:
                description: 'Pass unit tests?'
                type: boolean
                default: true
jobs:
    lint-build:
        runs-on: ubuntu-latest
        steps:
            - name: Lint
              run: |
                echo "Linting the code and building project"
            - name: Build
              run: echo "Building the code"
    unit-test:
        runs-on: ubuntu-latest
        steps:
            - name: Run unit tests
              run: |
                echo "Running unit tests"
            - name: Check if unit tests passed
              if: ${{ !inputs.pass-unit-tests }}
              run: |
                echo "Unit tests failed, stopping the workflow"
                exit 1
    deploy-nonprod:
        runs-on: ubuntu-latest
        needs: [lint-build, unit-test]
        steps:
            - name: Deploy to non-prod
              run: echo "Deploying to non-prod environment"
    e2e-test:
        runs-on: ubuntu-latest
        needs: [deploy-nonprod]
        steps:
            - name: Run end-to-end tests
              run: echo "Running end-to-end tests"
    load-test:
        runs-on: ubuntu-latest
        needs: [deploy-nonprod]
        steps:
            - name: Run load tests
              run: echo "Running load tests"
    deploy-prod:
        runs-on: ubuntu-latest
        needs:
            - e2e-test
            - load-test
        steps:
            - name: Deploy to prod
              run: echo "Deploying to prod environment"
    

    