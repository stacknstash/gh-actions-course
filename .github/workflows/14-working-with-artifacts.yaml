name: 14 - work with artifacts

on:
    workflow_dispatch:

jobs:
    test-build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: .github/14-working-with-artifacts/react-app
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: 20.x
            - name: Download cached dependencies
              uses: actions/cache@v3
              id: cache
              with:
                path: .github/14-working-with-artifacts/react-app/node_modules
                key: deps-node-modules-${{ hashFiles('14-working-with-artifacts/react-app/package-lock.json') }}
            - name: Install dependencies
              if: steps.cache.outputs.cache-hit != 'true'
              run: npm install && npm ci
            - name: Unit testing
              run: npm run test
            - name: Build code
              run: npm run build
            - name: Upload build artifacts
              uses: actions/upload-artifact@v3
              with:
                  name: app
                  path: .github/14-working-with-artifacts/react-app/build
    deploy:
        runs-on: ubuntu-latest
        needs: test-build
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v3
              with:
                  name: app
                  path: build
            - name: show folder strcuture
              run: |
                pwd
                ls -R
            

